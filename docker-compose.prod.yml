# Production stack: only the web container is published.
# SQL Server and the API are reachable only inside the Docker network.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env}
      READONLY_PASSWORD: ${READONLY_PASSWORD:?Set READONLY_PASSWORD in .env}
    volumes:
      - ./db:/db:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          /opt/mssql-tools18/bin/sqlcmd -b -C -S sqlserver -U sa -P "$$SA_PASSWORD" -i /db/dataset.sql -v READONLY_PASSWORD="$$READONLY_PASSWORD" && exit 0
          echo "db-init: attempt $$i failed, retrying in 5s"
          sleep 5
        done
        exit 1
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/AskMyData.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ReadOnly: "Server=sqlserver,1433;Database=AskMyData;User Id=askmydata_reader;Password=${READONLY_PASSWORD:?Set READONLY_PASSWORD in .env};TrustServerCertificate=True;Encrypt=True;ApplicationIntent=ReadOnly"
      Llm__Provider: ${LLM_PROVIDER:-Stub}
      Llm__Gemini__ApiKey: ${GEMINI_API_KEY:-}
      Llm__Gemini__Model: ${GEMINI_MODEL:-gemini-3.5-flash-lite}

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  sqldata: