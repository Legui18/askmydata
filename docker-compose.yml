services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # One-shot job: runs db/dataset.sql (idempotent) then exits.
  # Uses the server image because it ships sqlcmd 18 (mssql-tools18 is not published as an image).
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env}
      READONLY_PASSWORD: ${READONLY_PASSWORD:?Set READONLY_PASSWORD in .env}
    volumes:
      - ./db:/db:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - /opt/mssql-tools18/bin/sqlcmd -b -C -S sqlserver -U sa -P "$$SA_PASSWORD" -i /db/dataset.sql -v READONLY_PASSWORD="$$READONLY_PASSWORD"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/AskMyData.Api/Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ReadOnly: "Server=sqlserver,1433;Database=AskMyData;User Id=askmydata_reader;Password=${READONLY_PASSWORD:?Set READONLY_PASSWORD in .env};TrustServerCertificate=True;Encrypt=True;ApplicationIntent=ReadOnly"
      Llm__Provider: ${LLM_PROVIDER:-Stub}
      Llm__Gemini__ApiKey: ${GEMINI_API_KEY:-}

volumes:
  sqldata:
