<div class="table-wrapper">
  <table class="result-table">
    <thead>
      <tr>
        @for (col of columns(); track col.name) {
          <th [style.text-align]="getCellAlign(col)">{{ col.name }} <span class="type-badge">{{ col.type }}</span></th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track $index) {
        <tr>
          @for (cell of row; track $index; let colIdx = $index) {
            <td [style.text-align]="getCellAlign(columns()[colIdx])">{{ formatCell(cell, columns()[colIdx]) }}</td>
          }
        </tr>
      } @empty {
        <tr>
          <td [attr.colspan]="columns().length" class="empty-state">Sin resultados</td>
        </tr>
      }
    </tbody>
  </table>
</div>
@if (truncated()) {
  <p class="truncated-notice">Resultado truncado</p>
}
